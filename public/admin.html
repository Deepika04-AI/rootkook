<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>RootKook Review Queue</title>
<style>
:root{--bg:#f3f5f7;--surface:#fff;--ink:#17283a;--muted:#566476;--line:#d6dde5;--accent:#e0a21f;--warn:#b4552a;--ok:#2f7d4f}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:1.6rem}h2{margin:12px 0 0;font-size:1.15rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;min-width:0;flex:1}
button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer}
button.ok{background:var(--accent);border-color:var(--accent)}button.no{color:var(--warn)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted);font-size:.9rem}details summary{cursor:pointer;color:var(--muted)}
pre{white-space:pre-wrap;font:inherit;font-size:.9rem;margin:0}
</style>
</head>
<body>
<main>
  <h1>RootKook review queue</h1>
  <p class="muted">Check each shared recipe before it appears on the community table. Look for personal details (phone numbers, addresses, full names of children) and anything that isn't a recipe.</p>
  <form class="row" id="login"><input type="password" id="key" placeholder="Admin password" autocomplete="current-password"><button class="ok">Open queue</button></form>
  <p id="msg" class="muted"></p>
  <section id="lists" hidden>
    <h2>Waiting for review (<span id="np">0</span>)</h2><div id="pending" style="display:flex;flex-direction:column;gap:12px"></div>
    <h2>On the community table (<span id="na">0</span>)</h2><div id="approved" style="display:flex;flex-direction:column;gap:12px"></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let KEY = sessionStorage.getItem("rk.admin") || "";
async function call(method, body){
  const r = await fetch("/api/admin", { method, headers: { "x-admin-key": KEY, ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Request failed"); return j;
}
function item(x, kind){
  const c = x.card || {};
  return `<div class="item"><strong>${esc(c.title)}</strong>
    <span class="muted">${esc([c.elder?.name, c.elder?.place].filter(Boolean).join(" · "))} · shared ${new Date(x.sharedAt).toLocaleString()}</span>
    <pre>${esc((c.story || []).join("\n\n"))}</pre>
    <details><summary>Ingredients and steps</summary><pre>${esc((c.ingredients || []).map(i => "• " + i.item + ": " + i.elderMeasure).join("\n"))}\n\n${esc((c.steps || []).map((s, k) => (k + 1) + ". " + s.text).join("\n"))}</pre></details>
    <div class="row">${kind === "p" ? `<button class="ok" data-a="approve" data-id="${esc(x.id)}">Approve</button><button class="no" data-a="reject" data-id="${esc(x.id)}">Reject</button>` : `<button class="no" data-a="remove" data-id="${esc(x.id)}">Remove from table</button>`}</div></div>`;
}
async function load(){
  try {
    const { pending, approved } = await call("GET");
    sessionStorage.setItem("rk.admin", KEY);
    $("#lists").hidden = false; $("#login").hidden = true; $("#msg").textContent = "";
    $("#np").textContent = pending.length; $("#na").textContent = approved.length;
    $("#pending").innerHTML = pending.map(x => item(x, "p")).join("") || '<p class="muted">Nothing waiting.</p>';
    $("#approved").innerHTML = approved.sort((a, b) => b.sharedAt - a.sharedAt).map(x => item(x, "a")).join("") || '<p class="muted">Nothing approved yet.</p>';
    document.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => { b.disabled = true; try { await call("POST", { action: b.dataset.a, id: b.dataset.id }); load(); } catch (e) { $("#msg").textContent = e.message; b.disabled = false; } });
  } catch (e) { $("#msg").textContent = e.message; $("#login").hidden = false; }
}
$("#login").onsubmit = e => { e.preventDefault(); KEY = $("#key").value; load(); };
if (KEY) load();
</script>
</body>
</html>
